name: optcg_manager
description: "OPTCG BH: colecao, biblioteca e marketplace regional para One Piece TCG."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  http: ^1.2.2
  image: ^4.2.0
  intl: ^0.20.2
  translator: ^1.0.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  camera: ^0.12.0+1
  url_launcher: ^6.3.1
  web: ^1.1.1
  google_mlkit_text_recognition: ^0.15.1
  supabase_flutter: ^2.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/visual_card_fingerprints.json
    - assets/liga_one_piece_price_cache.json
    - assets/one_piece_cards_cache.json
    - assets/test_samples/boa_hancock_p115.jpeg
    - assets/editorial/
