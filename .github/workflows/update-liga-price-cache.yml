name: Update Liga price cache

on:
  workflow_dispatch:
    inputs:
      card_code:
        description: "Codigo da carta para atualizar uma carta especifica"
        required: false
        type: string
      card_name:
        description: "Nome da carta para atualizar uma carta especifica"
        required: false
        type: string
  schedule:
    - cron: "0 8 * * *"

jobs:
  update-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh active sale prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CARD_CODE: ${{ inputs.card_code }}
          CARD_NAME: ${{ inputs.card_name }}
        run: |
          if [ -n "$CARD_CODE" ]; then
            python scripts/update_marketplace_liga_price_cache.py --code "$CARD_CODE" --name "$CARD_NAME" --refresh-days 0 --sleep 0.8
          else
            python scripts/update_marketplace_liga_price_cache.py --refresh-days 0 --sleep 0.8
          fi
