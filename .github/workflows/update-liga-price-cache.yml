name: Update Liga price cache

on:
  workflow_dispatch:
    inputs:
      card_code:
        description: "Codigo da carta para atualizar uma carta especifica"
        required: false
        type: string
      card_name:
        description: "Nome da carta para atualizar uma carta especifica"
        required: false
        type: string
      edition:
        description: "Sigla de uma edicao para atualizar em lote, por exemplo OP-16"
        required: false
        type: string
      shard_index:
        description: "Grupo das edicoes antigas (0, 1 ou 2)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 11 * * *"
    - cron: "17 19 * * *"

concurrency:
  group: update-liga-price-cache
  cancel-in-progress: false

jobs:
  update-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh Liga prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CARD_CODE: ${{ inputs.card_code }}
          CARD_NAME: ${{ inputs.card_name }}
          EDITION: ${{ inputs.edition }}
          MANUAL_SHARD_INDEX: ${{ inputs.shard_index }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL ou SUPABASE_SERVICE_ROLE_KEY nao configurado. Cache da Liga nao foi atualizado."
            exit 1
          fi

          if [ -n "$CARD_CODE" ]; then
            python scripts/update_marketplace_liga_price_cache.py --code "$CARD_CODE" --name "$CARD_NAME" --refresh-days 0 --sleep 0.8
          elif [ -n "$EDITION" ]; then
            python scripts/update_liga_edition_price_cache.py --edition "$EDITION"
          else
            case "$SCHEDULE_EXPRESSION" in
              "17 3 * * *") shard_index=0 ;;
              "17 11 * * *") shard_index=1 ;;
              "17 19 * * *") shard_index=2 ;;
              *) shard_index="${MANUAL_SHARD_INDEX:-0}" ;;
            esac
            python scripts/update_liga_edition_price_cache.py \
              --shard-count 3 \
              --shard-index "$shard_index" \
              --priority-editions 3 \
              --delay 360
          fi
