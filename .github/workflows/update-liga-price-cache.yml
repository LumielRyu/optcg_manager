name: Update Liga price cache

on:
  workflow_dispatch:
    inputs:
      card_code:
        description: "Codigo da carta para atualizar uma carta especifica"
        required: false
        type: string
      card_name:
        description: "Nome da carta para atualizar uma carta especifica"
        required: false
        type: string
      edition:
        description: "Sigla de uma edicao para atualizar em lote, por exemplo OP-16"
        required: false
        type: string
      shard_index:
        description: "Grupo das edicoes antigas (0, 1 ou 2)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 11 * * *"
    - cron: "17 19 * * *"

concurrency:
  group: update-liga-price-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-cache:
    runs-on: [self-hosted, Windows, X64, liga-price-cache]
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh Liga prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CARD_CODE: ${{ inputs.card_code }}
          CARD_NAME: ${{ inputs.card_name }}
          EDITION: ${{ inputs.edition }}
          MANUAL_SHARD_INDEX: ${{ inputs.shard_index }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (
            [string]::IsNullOrWhiteSpace($env:SUPABASE_URL) -or
            [string]::IsNullOrWhiteSpace($env:SUPABASE_SERVICE_ROLE_KEY)
          ) {
            Write-Output "::error::SUPABASE_URL ou SUPABASE_SERVICE_ROLE_KEY nao configurado. Cache da Liga nao foi atualizado."
            exit 1
          }

          if (-not [string]::IsNullOrWhiteSpace($env:CARD_CODE)) {
            python scripts/update_marketplace_liga_price_cache.py `
              --code "$env:CARD_CODE" `
              --name "$env:CARD_NAME" `
              --refresh-days 0 `
              --sleep 0.8
          } elseif (-not [string]::IsNullOrWhiteSpace($env:EDITION)) {
            python scripts/update_liga_edition_price_cache.py `
              --edition "$env:EDITION"
          } else {
            $shardIndex = switch ($env:SCHEDULE_EXPRESSION) {
              "17 3 * * *" { "0"; break }
              "17 11 * * *" { "1"; break }
              "17 19 * * *" { "2"; break }
              default {
                if ([string]::IsNullOrWhiteSpace($env:MANUAL_SHARD_INDEX)) {
                  "0"
                } else {
                  $env:MANUAL_SHARD_INDEX
                }
              }
            }
            python scripts/update_liga_edition_price_cache.py `
              --shard-count 3 `
              --shard-index "$shardIndex" `
              --priority-editions 3 `
              --delay 360
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
