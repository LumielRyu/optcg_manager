          );
        }
      }

      window.addEventListener('hashchange', updatePageMetadata);
      window.addEventListener('flutter-first-frame', updatePageMetadata);

  <script>
    (function () {
      const cacheResetVersion = '2026-07-28-pokemon-liga-prices-v1';
      const tesseractUrl = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      let tesseractLoadPromise = null;

      window.loadTesseractJs = function () {
        if (window.Tesseract) {
          return Promise.resolve(window.Tesseract);
        }

        if (tesseractLoadPromise) {
          return tesseractLoadPromise;
        }

        tesseractLoadPromise = new Promise(function (resolve, reject) {
          const script = document.createElement('script');
          script.src = tesseractUrl;
          script.async = true;
          script.onload = function () {
            if (window.Tesseract) {
              resolve(window.Tesseract);
            } else {
              reject(new Error('Tesseract.js loaded without global object.'));
            }
          };
          script.onerror = function () {
            tesseractLoadPromise = null;
            reject(new Error('Failed to load Tesseract.js.'));
          };
          document.body.appendChild(script);
        });

        return tesseractLoadPromise;
      };

      function loadFlutter() {
        const bootstrap = document.createElement('script');
        bootstrap.src = 'flutter_bootstrap.js';
        bootstrap.async = true;
        document.body.appendChild(bootstrap);
      }

      async function resetStaleCaches() {
        try {
          if (window.localStorage.getItem('optcg_cache_reset_version') === cacheResetVersion) {
            return;
          }

          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          }

          if ('caches' in window) {
            const cacheNames = await window.caches.keys();
            await Promise.all(cacheNames.map(function (cacheName) {
              return window.caches.delete(cacheName);
            }));
          }

          window.localStorage.setItem('optcg_cache_reset_version', cacheResetVersion);
        } catch (error) {
          console.warn('Unable to reset stale app caches.', error);
        }
      }

      resetStaleCaches().finally(loadFlutter);
    }());
  </script>
