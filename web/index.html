<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="OPTCG BH: coleção, biblioteca e marketplace do One Piece TCG em Belo Horizonte."
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OPTCG BH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OPTCG BH</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #060a10;
      --panel: rgba(15, 32, 41, 0.92);
      --panel-soft: rgba(24, 50, 59, 0.84);
      --text: #f4f7fb;
      --muted: #a9bdc7;
      --accent: #28d7e8;
      --accent-soft: #4f8cff;
      --accent-warm: #f4b740;
      --outline: rgba(40, 215, 232, 0.22);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(rgba(40, 215, 232, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(40, 215, 232, 0.035) 1px, transparent 1px),
        radial-gradient(circle at top left, rgba(40, 215, 232, 0.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(79, 140, 255, 0.14), transparent 32%),
        var(--bg);
      background-size: 34px 34px, 34px 34px, auto, auto, auto;
      z-index: 9999;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #app-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: min(100%, 460px);
      padding: 28px 24px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--panel), var(--panel-soft));
      border: 1px solid var(--outline);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
      text-align: center;
    }

    .loader-title {
      margin: 0;
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 800;
      letter-spacing: 0;
    }

    .loader-subtitle {
      margin: 10px 0 0;
      font-size: 15px;
      line-height: 1.55;
      color: var(--muted);
    }

    .loader-bar {
      margin-top: 22px;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(40, 215, 232, 0.16);
    }

    .loader-bar > span {
      display: block;
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-soft), var(--accent), var(--accent-warm));
      animation: loading-slide 1.4s ease-in-out infinite;
    }

    .loader-tip {
      margin-top: 14px;
      font-size: 12px;
      letter-spacing: 0;
      color: var(--muted);
      text-transform: uppercase;
    }

    @keyframes loading-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div id="app-loader" aria-live="polite">
    <div class="loader-card">
      <h1 class="loader-title">OPTCG BH</h1>
      <p class="loader-subtitle">
        Carregando sua coleção, biblioteca e marketplace do One Piece TCG em BH.
      </p>
      <div class="loader-bar" aria-hidden="true">
        <span></span>
      </div>
      <div class="loader-tip">Preparando cartas e vitrine</div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('app-loader');
      if (loader) loader.classList.add('hidden');
    });

    window.setTimeout(function () {
      const loader = document.getElementById('app-loader');
      if (loader) loader.classList.add('hidden');
    }, 15000);
  </script>

  <script>
    (function () {
      const cacheResetVersion = '2026-07-02-csp-v2';
      const tesseractUrl = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      let tesseractLoadPromise = null;

      window.loadTesseractJs = function () {
        if (window.Tesseract) {
          return Promise.resolve(window.Tesseract);
        }

        if (tesseractLoadPromise) {
          return tesseractLoadPromise;
        }

        tesseractLoadPromise = new Promise(function (resolve, reject) {
          const script = document.createElement('script');
          script.src = tesseractUrl;
          script.async = true;
          script.onload = function () {
            if (window.Tesseract) {
              resolve(window.Tesseract);
            } else {
              reject(new Error('Tesseract.js loaded without global object.'));
            }
          };
          script.onerror = function () {
            tesseractLoadPromise = null;
            reject(new Error('Failed to load Tesseract.js.'));
          };
          document.body.appendChild(script);
        });

        return tesseractLoadPromise;
      };

      function loadFlutter() {
        const bootstrap = document.createElement('script');
        bootstrap.src = 'flutter_bootstrap.js';
        bootstrap.async = true;
        document.body.appendChild(bootstrap);
      }

      async function resetStaleCaches() {
        try {
          if (window.localStorage.getItem('optcg_cache_reset_version') === cacheResetVersion) {
            return;
          }

          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          }

          if ('caches' in window) {
            const cacheNames = await window.caches.keys();
            await Promise.all(cacheNames.map(function (cacheName) {
              return window.caches.delete(cacheName);
            }));
          }

          window.localStorage.setItem('optcg_cache_reset_version', cacheResetVersion);
        } catch (error) {
          console.warn('Unable to reset stale app caches.', error);
        }
      }

      resetStaleCaches().finally(loadFlutter);
    }());
  </script>
</body>
</html>
